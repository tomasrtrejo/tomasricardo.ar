<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" fill="none">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#1A1C22"/>
  <defs>
    <pattern id="ind-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#262B34" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#ind-grid)"/>

  <!-- Progressive Stamping Die & CNC Sheet Metal Origami -->
  <g transform="translate(160, 85)">
    <!-- Bend relief slots & laser path -->
    <rect x="-80" y="-35" width="160" height="70" rx="0" fill="#242933" stroke="#3A414B" stroke-width="1.2"/>
    
    <!-- Relief notch corner cutouts -->
    <rect x="-80" y="-12" width="20" height="24" fill="#1A1C22" stroke="#FF6B26" stroke-width="1.2"/>
    <rect x="60" y="-12" width="20" height="24" fill="#1A1C22" stroke="#FF6B26" stroke-width="1.2"/>
    
    <!-- Laser punch line -->
    <line x1="-50" y1="-35" x2="-50" y2="35" stroke="#FF6B26" stroke-width="1.5" stroke-dasharray="4 2"/>
    <line x1="50" y1="-35" x2="50" y2="35" stroke="#FF6B26" stroke-width="1.5" stroke-dasharray="4 2"/>
    
    <!-- Mounting hole array -->
    <circle cx="-25" cy="0" r="5" fill="#1A1C22" stroke="#E1E8F2" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="6" fill="#FF6B26" fill-opacity="0.3" stroke="#FF6B26" stroke-width="1.5"/>
    <circle cx="25" cy="0" r="5" fill="#1A1C22" stroke="#E1E8F2" stroke-width="1.2"/>
  </g>

  <!-- Typography overlay -->
  <text x="28" y="162" fill="#8892A0" font-family="'JetBrains Mono', monospace" font-size="8">04 // ESCALABILIDAD INDUSTRIAL</text>
  <text x="292" y="162" fill="#FF6B26" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="end">ESTAMPA CNC • 10k+ U/MES</text>
</svg>
