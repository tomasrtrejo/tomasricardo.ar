<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" fill="none">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#1A1C22"/>
  <defs>
    <pattern id="col-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#262B34" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#col-grid)"/>

  <!-- Interlocking Joint & Distributed Node Diagram -->
  <g transform="translate(160, 85)">
    <!-- Node network links -->
    <line x1="-80" y1="-30" x2="0" y2="0" stroke="#3A414B" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="80" y1="-30" x2="0" y2="0" stroke="#3A414B" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="-60" y1="40" x2="0" y2="0" stroke="#3A414B" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="60" y1="40" x2="0" y2="0" stroke="#3A414B" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- Interlocking finger puzzle joint -->
    <path d="M -30 -35 L 30 -35 L 30 -15 L 15 -15 L 15 0 L 30 0 L 30 20 L -30 20 L -30 5 L -15 5 L -15 -15 L -30 -15 Z" fill="#242933" stroke="#E1E8F2" stroke-width="1.8"/>
    <rect x="-10" y="-10" width="20" height="20" fill="#FF6B26" fill-opacity="0.25" stroke="#FF6B26" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#FF6B26"/>

    <!-- Peripheral nodes -->
    <circle cx="-80" cy="-30" r="8" fill="#202328" stroke="#8892A0" stroke-width="1.5"/>
    <circle cx="80" cy="-30" r="8" fill="#202328" stroke="#8892A0" stroke-width="1.5"/>
    <circle cx="-60" cy="40" r="8" fill="#202328" stroke="#8892A0" stroke-width="1.5"/>
    <circle cx="60" cy="40" r="8" fill="#202328" stroke="#8892A0" stroke-width="1.5"/>
  </g>

  <!-- Typography overlay -->
  <text x="28" y="162" fill="#8892A0" font-family="'JetBrains Mono', monospace" font-size="8">03 // MANUFACTURA DISTRIBUIDA</text>
  <text x="292" y="162" fill="#FF6B26" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="end">OPEN DFM • ENCASTRES</text>
</svg>
