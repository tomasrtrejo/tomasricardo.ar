<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" fill="none">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#1A1C22"/>
  <defs>
    <pattern id="btr-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#262B34" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#btr-grid)"/>

  <!-- Technical Sketch: Curvature & Stress Concentrator Notebook -->
  <g stroke="#3A414B" stroke-width="1" stroke-dasharray="2 2">
    <line x1="40" y1="90" x2="280" y2="90"/>
    <line x1="160" y1="20" x2="160" y2="160"/>
  </g>

  <!-- Part profile with transition radius -->
  <path d="M 60 140 L 60 70 Q 60 45 85 45 L 260 45 L 260 85 L 120 85 Q 100 85 100 105 L 100 140 Z" fill="#222730" stroke="#E1E8F2" stroke-width="1.8"/>
  <path d="M 85 45 Q 60 45 60 70" stroke="#FF6B26" stroke-width="2.5" fill="none"/>
  
  <!-- Dimension radius arrow -->
  <circle cx="85" cy="70" r="18" stroke="#FF6B26" stroke-width="1" stroke-dasharray="3 2" fill="none"/>
  <circle cx="85" cy="70" r="2.5" fill="#FF6B26"/>
  <line x1="85" y1="70" x2="115" y2="35" stroke="#FF6B26" stroke-width="1.2"/>

  <!-- Typography overlay -->
  <text x="125" y="32" fill="#FF6B26" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">Rmin = 1.5 mm</text>
  <text x="28" y="162" fill="#8892A0" font-family="'JetBrains Mono', monospace" font-size="8">01 // BITÁCORA TÉCNICA</text>
  <text x="292" y="162" fill="#525B68" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="end">CROQUIS DFM</text>
</svg>
